# The reference set of the shared memory's recall (rag_eval, RagEvalDataset). The probe
# src/crews/_probe-shared-memory/probe.ork.ts runs it on a copy of this folder staged as
# /workspace/.orkeon/memory by scripts/check-shared-memory.sh. `relevant` names source path
# suffixes (entries/<type>/<id>.md). q13 has no answer in the memory: it carries no `relevant`
# and is left out of recall@5 and MRR. q08's target supersedes an entry that is never expected.
name: memory-golden
corpus: /workspace/.orkeon/memory/entries
collection: memory-eval-golden
cases:
  - id: q01
    question: "How should currency amounts be stored?"
    relevant: [entries/decision/billing-decision-20261012-money-as-minor-units.md]
    tags: [decision]
  - id: q02
    question: "Two projects disagree on money storage: what did each decide?"
    relevant: [entries/decision/billing-decision-20261012-money-as-minor-units.md, entries/decision/shop-decision-20261014-money-as-decimal.md]
    tags: [decision, cross-project]
  - id: q03
    question: "How does TypeScript code under Jint reach a runtime tool?"
    relevant: [entries/code-structure/orkeon-code-code-structure-20261015-port-adapter-fake.md]
