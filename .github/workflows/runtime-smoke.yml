# Runtime smoke: the real Orkeon REPL boots on the demo fixture and must load every
# slash command (scripts/smoke-runtime.sh). No LLM is called.
#
# The runtime is Orkeon's sources at the commit pinned in .orkeon-version (ADR
# 0013): the job checks them out, builds the REPL and runs the launcher's source
# mode, the reference runtime of Orkeon Code. A release (the tool or the image)
# is never the pin, so it is never what the smoke runs.
#
# Runs when the runtime pin, the launcher or this workflow changes, every week, and
# on demand.
name: Runtime smoke
on:
  pull_request:
    branches: [ main ]
    paths:
      - '.orkeon-version'
      - 'orkeon-code'
      - 'scripts/smoke-runtime.sh'
      - 'src/commands/**'
      - '.github/workflows/runtime-smoke.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pin (the commit of Orkeon's main in .orkeon-version)
        id: pin
        run: |
          ref="$(tr -d '[:space:]' < .orkeon-version)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Runtime: Orkeon's sources at $ref"
      - name: Check out Orkeon's sources at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Orkeon/orkeon
          ref: ${{ steps.pin.outputs.ref }}
          path: .orkeon-source
          persist-credentials: false
      - name: Set up the .NET SDK Orkeon pins
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: .orkeon-source/global.json
      - name: Set up Node (the esbuild the source mode bundles with)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore Orkeon and install esbuild
        run: |
          dotnet restore .orkeon-source/src/apps/Orkeon.ConsoleApp --nologo
          npm ci --no-audit --no-fund
      - name: Boot the REPL and load the command surface
        env:
          ORKEON_SOURCE: ${{ github.workspace }}/.orkeon-source
        run: bash scripts/smoke-runtime.sh --mode source
