# Secret scanning (gitleaks) over the full history, as in Orkeon/orkeon.
#
# The gitleaks binary rather than gitleaks/gitleaks-action: the action requires a paid
# licence for repositories owned by an organisation, and Orkeon is one.
# Findings stay in the job log, redacted. No SARIF artifact on purpose: on a public
# repository it would publish the matched material as a downloadable file.
name: Secret scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
env:
  GITLEAKS_VERSION: '8.28.0'
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans history, not just the working tree
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan the history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
