# The speech MCP server of Orkeon Code (speech-to-text and speech output). Not a package: `uv run --project mcp/whisper`
# resolves these dependencies into mcp/whisper/.venv and runs the script.
[project]
name = "orkeon-code-whisper-mcp"
version = "0.1.0"
description = "Speech-to-text and speech output for Orkeon Code: an MCP server on faster-whisper and Piper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  # mcp 2.x renamed FastMCP to MCPServer and quits on stdin EOF before a running call answers:
  # the server is written against the 1.x API, which speaks the protocol Orkeon requires (2025-06-18).
  "mcp>=1.30,<2",
  "faster-whisper>=1.2",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]  # the openai and http backends
cuda = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9"]  # WHISPER_DEVICE=cuda on a machine without the CUDA toolkit
voice = ["sounddevice>=0.5"]  # record_and_transcribe (/voice) and speak's playback: the microphone and the speaker, through PortAudio
# speak's synthesis. piper-tts is GPL-3.0: the server runs it as a subprocess (python -m piper), never imports it.
tts = ["piper-tts>=1.3"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
