# gitleaks configuration: the default ruleset, plus the reviewed false positives below.
# A reviewed false positive is allowlisted by exact path, with a comment saying why.
title = "orkeon-code"

[extend]
useDefault = true

[[allowlists]]
description = "Fake secrets the 'secrets' rule set must refuse: test fixtures, not credentials"
paths = [
  '''^src/shared/domain/agent-policy/rule-sets\.(test|fixtures)\.ts$''',
]

[[allowlists]]
description = "Made-up tool-bridge tokens the launcher tests export (a long one, a short one, a padded one): test fixtures, not credentials"
paths = [
  '''^tests/scripts/launcher\.run\.fixtures\.ts$''',
]
